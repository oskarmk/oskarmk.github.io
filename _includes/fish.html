<div class="mascot" id="fish" title="Hello">
  <svg viewBox="0 0 200 200" role="img" aria-label="Ink-wash koi that swims toward your cursor">
    <defs>
      <!-- soft bleeding edge for washes -->
      <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="5" result="d"/>
        <feGaussianBlur in="d" stdDeviation="1.1"/>
      </filter>
      <!-- dry-brush edge for strokes -->
      <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
      </filter>
      <linearGradient id="ink-body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="wash-light"/>
        <stop offset="0.55" class="wash-mid"/>
        <stop offset="1" class="wash-dark"/>
      </linearGradient>
      <linearGradient id="ink-fin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" class="fin-a"/>
        <stop offset="1" class="fin-b"/>
      </linearGradient>
    </defs>

    <!-- faint ripples -->
    <g class="ripples" filter="url(#brush)">
      <path d="M18,168 C40,162 62,164 80,170" />
      <path d="M104,182 C126,176 150,178 170,184" />
      <path d="M140,30 C152,27 164,28 174,32" />
    </g>

    <!-- hanging bamboo leaves -->
    <g class="leaves" filter="url(#brush)">
      <path class="stem" d="M204,0 C192,8 182,18 174,30" />
      <path class="leaf" d="M176,28 C164,40 150,56 136,80 C146,66 162,48 180,31 Z" />
      <path class="leaf" d="M180,24 C180,40 184,56 194,72 C190,56 186,40 184,22 Z" />
      <path class="leaf faint" d="M186,14 C172,16 156,22 140,32 C156,26 172,20 188,18 Z" />
    </g>

    <!-- the fish: rotates as a whole, tail and fins move -->
    <g id="fish-swim">
      <g id="fish-body" filter="url(#wash)">
        <g id="fish-tail">
          <path class="fin" d="M132,100 C146,92 160,80 183,70 C176,82 172,92 168,100 C172,108 176,118 183,132 C162,122 146,108 132,100 Z" />
        </g>
        <path class="fin" d="M64,85 C74,70 98,68 117,90 C100,86 82,85 64,85 Z" />
        <g id="fish-fin">
          <path class="fin" d="M54,112 C54,126 64,138 80,141 C72,130 64,120 54,112 Z" />
        </g>
        <path class="fin" d="M92,114 C96,124 104,130 113,131 C106,122 100,117 92,114 Z" />
        <path class="fin" d="M112,108 C116,114 122,118 129,118 C124,112 118,109 112,108 Z" />
        <path class="body" d="M30,100 C32,90 44,84 62,84 C86,84 110,90 132,97 C134,99 134,101 132,103 C110,110 86,116 62,116 C44,116 32,110 30,100 Z" />
        <path class="back" d="M36,93 C52,82 88,81 130,96 C110,92 84,88 60,89 C50,89 43,91 36,93 Z" />
        <path class="koi-red" d="M33,96 C36,87 46,84 55,88 C50,95 42,99 33,96 Z" />
        <path class="koi-red" d="M70,88 C82,84 96,88 105,96 C94,100 80,97 70,88 Z" />
        <path class="koi-red soft" d="M108,100 C114,97 120,97 127,99 C120,104 113,105 108,100 Z" />
      </g>
      <g class="strokes" filter="url(#brush)">
        <path class="ray" id="fish-rays" d="M134,99 L177,74 M134,100 L166,100 M134,101 L177,126" />
        <path class="ray" d="M74,84 L82,73 M84,84 L92,72 M94,85 L101,75 M104,87 L109,80" />
        <path class="gill" d="M50,89 C55,96 55,106 51,112" />
        <path class="barbel" d="M31,103 C27,108 23,110 18,109 M33,105 C30,111 27,114 22,116" />
        <path class="outline" d="M30,100 C32,90 44,84 62,84 C86,84 110,90 132,97 M30,100 C32,110 44,116 62,116 C86,116 110,110 132,103" />
      </g>
      <circle class="eye" cx="42" cy="95.5" r="2.7" />
      <circle class="pupil" cx="41.6" cy="95.3" r="1.8" />
    </g>

    <g id="bubbles"></g>
  </svg>
</div>
