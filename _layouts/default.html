<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <meta name="theme-color" content="#f6f5f1">
    <script>
      // apply saved theme before paint (light is the default)
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
  </head>
  <body>
    {% include fish.html %}

    <main class="page{% if page.layout == 'post' %} page-post{% endif %}">
      {% include header.html %}

      {{ content }}

      <footer class="colophon">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}
          <span class="dot" aria-hidden="true">·</span> <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
          <span class="dot" aria-hidden="true">·</span> <a href="https://chusikowski.substack.com/">Substack</a>
        </span>
        <a class="seal" href="{{ "/" | relative_url }}" aria-label="Home">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect x="2" y="2" width="36" height="36" rx="3" />
            <text x="20" y="27" text-anchor="middle">OM</text>
          </svg>
        </a>
      </footer>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        function sync() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
          if (meta) meta.setAttribute('content', dark ? '#151413' : '#f6f5f1');
        }
        btn.addEventListener('click', function () {
          var dark = root.getAttribute('data-theme') !== 'dark';
          if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
          try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
          sync();
        });
        sync();
      })();
    </script>
    <script src="{{ "/assets/js/fish.js" | relative_url }}" defer></script>
  </body>
</html>
