<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <meta name="theme-color" content="#f6f5f1">
    <script>
      // apply saved theme before paint (light is the default)
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
  </head>
  <body>
    {% include fish.html %}

    <main class="page">
      <header class="masthead">
        <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      {{ content }}

      <footer class="colophon">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
        <a class="seal" href="{{ "/" | relative_url }}" aria-label="Home">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect x="2" y="2" width="36" height="36" rx="3" />
            <text x="20" y="27" text-anchor="middle">OM</text>
          </svg>
        </a>
      </footer>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        function sync() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
          if (meta) meta.setAttribute('content', dark ? '#151413' : '#f6f5f1');
        }
        btn.addEventListener('click', function () {
          var dark = root.getAttribute('data-theme') !== 'dark';
          if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
          try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
          sync();
        });
        sync();
      })();
    </script>
    <script src="{{ "/assets/js/fish.js" | relative_url }}" defer></script>
  </body>
</html>
